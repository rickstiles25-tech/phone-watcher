<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Claude Screen Watcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #setup-screen {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: center;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
    }
    h1 { font-size: 1.5rem; color: #f5f5f5; }
    p.sub { font-size: 0.9rem; color: #a3a3a3; line-height: 1.4; }
    label { font-size: 0.82rem; color: #cccccc; margin-bottom: -8px; font-weight: 600; }
    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #141414;
      color: #fff;
      font-size: 0.98rem;
    }
    button.primary {
      background: #d97757;
      color: #000;
      font-weight: 700;
      border: none;
      margin-top: 6px;
      cursor: pointer;
    }
    #watcher-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }
    #answer-section {
      flex: 1;
      min-height: 36%;
      padding: 18px 20px;
      background: #0b0b0b;
      border-bottom: 1px solid #222;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #answer-text {
      font-size: clamp(1.9rem, 6.8vw, 3.4rem);
      font-weight: 700;
      line-height: 1.24;
      color: #ffffff;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .placeholder {
      color: #4a4a4a !important;
      font-weight: 500 !important;
      font-size: clamp(1.3rem, 4.5vw, 1.9rem) !important;
      text-align: center;
    }
    #middle-section {
      background: #111111;
      border-bottom: 1px solid #242424;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    #controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    #status-pill {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      background: #1c1c1c;
      color: #4ade80;
      margin-right: auto;
      white-space: nowrap;
    }
    .ctrl-btn {
      width: auto;
      padding: 7px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #222222;
      border: 1px solid #383838;
      color: #e5e5e5;
      border-radius: 8px;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #333; }
    .ctrl-btn.accent {
      background: #d97757;
      color: #000;
      border-color: #d97757;
    }
    #error-banner {
      display: none;
      width: 100%;
      background: #3b0d0d;
      border: 1px solid #ef4444;
      color: #fecaca;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    #settings-drawer {
      display: none;
      background: #181818;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 12px;
      flex-direction: column;
      gap: 10px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.84rem;
      color: #d4d4d4;
    }
    .setting-row input[type="range"] { width: 140px; padding: 0; }
    .setting-row input[type="checkbox"] { width: 18px; height: 18px; }
    #camera-section {
      height: 44%;
      min-height: 210px;
      background: #000;
      display: flex;
      flex-direction: column;
      padding: 8px 12px 12px 12px;
      gap: 8px;
      flex-shrink: 0;
    }
    #viewport-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      background: #080808;
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.25s ease-out;
    }
    #bbox-overlay {
      position: absolute;
      border: 2.5px solid #facc15;
      background: rgba(250, 204, 21, 0.12);
      border-radius: 6px;
      pointer-events: none;
      display: none;
      transition: all 0.2s ease-out;
    }
    #stage-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: #e5e5e5;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #333;
      pointer-events: none;
    }
    #camera-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #bdbdbd;
    }
    #zoom-slider { flex: 1; padding: 0; height: 26px; }
    #zoom-label {
      min-width: 44px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="setup-screen">
    <h1>Claude Screen Watcher</h1>
    <p class="sub">Watches your full screen, auto-zooms onto the entire text area when settled, and answers only the completely visible question.</p>
    <label for="api-key">Anthropic API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />
    <label for="model-select">Claude Model</label>
    <select id="model-select">
      <option value="claude-sonnet-4-6" selected>Claude Sonnet 4.6 (Recommended)</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (Fastest / Lowest Cost)</option>
    </select>
    <button class="primary" id="start-btn">Start Watching</button>
  </div>

  <div id="watcher-screen">
    <div id="answer-section">
      <div id="answer-text" class="placeholder">Waiting for a complete question on screen...</div>
    </div>

    <div id="middle-section">
      <div id="controls-row">
        <div id="status-pill">Ready</div>
        <button class="ctrl-btn accent" id="read-now-btn">Read now</button>
        <button class="ctrl-btn" id="toggle-cam-btn">Hide cam</button>
        <button class="ctrl-btn" id="settings-btn">Settings</button>
        <button class="ctrl-btn" id="stop-btn">Stop</button>
      </div>
      <div id="error-banner"></div>
      <div id="settings-drawer">
        <div class="setting-row">
          <span>Motion sensitivity</span>
          <input type="range" id="sensitivity-slider" min="1" max="10" value="5" />
        </div>
        <div class="setting-row">
          <span>Vibrate on new answer</span>
          <input type="checkbox" id="vibrate-chk" />
        </div>
        <div class="setting-row">
          <span>Beep on new answer</span>
          <input type="checkbox" id="beep-chk" />
        </div>
        <div class="setting-row">
          <button class="ctrl-btn" id="forget-key-btn" style="width:100%; color:#fca5a5; border-color:#7f1d1d;">Forget saved API key</button>
        </div>
      </div>
    </div>

    <div id="camera-section">
      <div id="viewport-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <div id="bbox-overlay"></div>
        <div id="stage-badge">Wide Overview</div>
      </div>
      <div id="camera-toolbar">
        <button class="ctrl-btn" id="switch-lens-btn" style="display:none;">Switch Lens</button>
        <span>Base Zoom</span>
        <input type="range" id="zoom-slider" min="0.25" max="2.50" step="0.05" value="0.75" />
        <span id="zoom-label">0.75×</span>
      </div>
    </div>
  </div>

  <canvas id="capture-canvas" style="display:none;"></canvas>
  <canvas id="diff-canvas" width="80" height="60" style="display:none;"></canvas>

  <script>
    const setupScreen = document.getElementById('setup-screen');
    const watcherScreen = document.getElementById('watcher-screen');
    const apiKeyInput = document.getElementById('api-key');
    const modelSelect = document.getElementById('model-select');
    const startBtn = document.getElementById('start-btn');

    const answerText = document.getElementById('answer-text');
    const statusPill = document.getElementById('status-pill');
    const readNowBtn = document.getElementById('read-now-btn');
    const toggleCamBtn = document.getElementById('toggle-cam-btn');
    const settingsBtn = document.getElementById('settings-btn');
    const stopBtn = document.getElementById('stop-btn');
    const errorBanner = document.getElementById('error-banner');

    const settingsDrawer = document.getElementById('settings-drawer');
    const sensitivitySlider = document.getElementById('sensitivity-slider');
    const vibrateChk = document.getElementById('vibrate-chk');
    const beepChk = document.getElementById('beep-chk');
    const forgetKeyBtn = document.getElementById('forget-key-btn');

    const cameraSection = document.getElementById('camera-section');
    const video = document.getElementById('video');
    const bboxOverlay = document.getElementById('bbox-overlay');
    const stageBadge = document.getElementById('stage-badge');
    const switchLensBtn = document.getElementById('switch-lens-btn');
    const zoomSlider = document.getElementById('zoom-slider');
    const zoomLabel = document.getElementById('zoom-label');

    const captureCanvas = document.getElementById('capture-canvas');
    const diffCanvas = document.getElementById('diff-canvas');

    let stream = null;
    let videoTrack = null;
    let rearDevices = [];
    let currentDeviceIdx = 0;

    let watchInterval = null;
    let settleTimer = null;
    let isBusy = false;
    let isZoomedIn = false;
    let lastFrameData = null;
    let wakeLock = null;
    let lastAnswer = '';

    if (localStorage.getItem('csw_api_key')) apiKeyInput.value = localStorage.getItem('csw_api_key');
    if (localStorage.getItem('csw_model')) modelSelect.value = localStorage.getItem('csw_model');
    if (localStorage.getItem('csw_zoom')) {
      zoomSlider.value = localStorage.getItem('csw_zoom');
      zoomLabel.textContent = parseFloat(zoomSlider.value).toFixed(2) + '×';
    }
    if (localStorage.getItem('csw_sens')) sensitivitySlider.value = localStorage.getItem('csw_sens');

    function setStatus(text, color = '#4ade80') {
      statusPill.textContent = text;
      statusPill.style.color = color;
    }

    function showError(msg) {
      setStatus('Error', '#f87171');
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    function clearError() {
      errorBanner.style.display = 'none';
      errorBanner.textContent = '';
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && watcherScreen.style.display === 'flex') {
        requestWakeLock();
      }
    });

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    startBtn.addEventListener('click', async () => {
      const cleanKey = apiKeyInput.value.trim();
      if (!cleanKey) {
        alert('Please enter your Anthropic API key.');
        return;
      }
      localStorage.setItem('csw_api_key', cleanKey);
      localStorage.setItem('csw_model', modelSelect.value);

      setupScreen.style.display = 'none';
      watcherScreen.style.display = 'flex';
      clearError();

      await requestWakeLock();
      await initCameras();
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(watchInterval);
      clearTimeout(settleTimer);
      if (stream) stream.getTracks().forEach(t => t.stop());
      watcherScreen.style.display = 'none';
      setupScreen.style.display = 'flex';
    });

    toggleCamBtn.addEventListener('click', () => {
      if (cameraSection.style.display === 'none') {
        cameraSection.style.display = 'flex';
        toggleCamBtn.textContent = 'Hide cam';
      } else {
        cameraSection.style.display = 'none';
        toggleCamBtn.textContent = 'Show cam';
      }
    });

    settingsBtn.addEventListener('click', () => {
      settingsDrawer.style.display = settingsDrawer.style.display === 'flex' ? 'none' : 'flex';
    });

    sensitivitySlider.addEventListener('input', () => {
      localStorage.setItem('csw_sens', sensitivitySlider.value);
    });

    forgetKeyBtn.addEventListener('click', () => {
      localStorage.removeItem('csw_api_key');
      apiKeyInput.value = '';
      stopBtn.click();
    });

    readNowBtn.addEventListener('click', () => {
      if (!isBusy) runFullCycle();
    });

    zoomSlider.addEventListener('input', () => {
      const z = parseFloat(zoomSlider.value);
      zoomLabel.textContent = z.toFixed(2) + '×';
      localStorage.setItem('csw_zoom', z);
      if (!isZoomedIn) {
        applyBaseZoom(z);
        lastFrameData = null;
      }
    });

    switchLensBtn.addEventListener('click', async () => {
      if (rearDevices.length > 1) {
        currentDeviceIdx = (currentDeviceIdx + 1) % rearDevices.length;
        await startCameraStream(rearDevices[currentDeviceIdx].deviceId);
      }
    });

    async function initCameras() {
      try {
        await startCameraStream(null);
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videos = devices.filter(d => d.kind === 'videoinput');
        rearDevices = videos.filter(d => /back|rear|environment|ultra|wide|0\.5/i.test(d.label));
        if (rearDevices.length === 0) rearDevices = videos;

        if (rearDevices.length > 1) {
          switchLensBtn.style.display = 'inline-block';
          const ultraIdx = rearDevices.findIndex(d => /ultra|0\.5|wide/i.test(d.label));
          if (ultraIdx !== -1 && ultraIdx !== currentDeviceIdx) {
            currentDeviceIdx = ultraIdx;
            await startCameraStream(rearDevices[currentDeviceIdx].deviceId);
          }
        }
      } catch (err) {
        showError('Camera initialization error: ' + err.message);
      }
    }

    async function startCameraStream(deviceId) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      const constraints = {
        audio: false,
        video: deviceId
          ? { deviceId: { exact: deviceId }, width: { ideal: 2560 }, height: { ideal: 1920 } }
          : { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1920 } }
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();
      videoTrack = stream.getVideoTracks()[0];

      const baseZ = parseFloat(zoomSlider.value) || 0.75;
      applyBaseZoom(baseZ);
      resetToWideOverview();

      clearInterval(watchInterval);
      watchInterval = setInterval(checkMotionLoop, 650);
    }

    function applyBaseZoom(targetZoom) {
      let hardwareApplied = false;
      if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
        const caps = videoTrack.getCapabilities();
        if (caps && caps.zoom) {
          const clamped = Math.max(caps.zoom.min, Math.min(caps.zoom.max, targetZoom));
          videoTrack.applyConstraints({ advanced: [{ zoom: clamped }] }).catch(() => {});
          hardwareApplied = true;
        }
      }
      if (targetZoom < 1.0 && !hardwareApplied) {
        video.style.transform = `scale(${Math.max(0.55, targetZoom)})`;
      } else if (!hardwareApplied) {
        video.style.transform = `scale(${targetZoom})`;
      } else {
        video.style.transform = 'scale(1)';
      }
    }

    function zoomIntoBox(box) {
      isZoomedIn = true;
      stageBadge.textContent = 'Zoomed on All Content';

      const bw = Math.max(0.25, box.x2 - box.x1);
      const bh = Math.max(0.25, box.y2 - box.y1);
      const cx = (box.x1 + box.x2) / 2;
      const cy = (box.y1 + box.y2) / 2;

      bboxOverlay.style.left = (box.x1 * 100) + '%';
      bboxOverlay.style.top = (box.y1 * 100) + '%';
      bboxOverlay.style.width = (bw * 100) + '%';
      bboxOverlay.style.height = (bh * 100) + '%';
      bboxOverlay.style.display = 'block';

      const zoomFactor = Math.min(2.2, Math.max(1.1, 0.90 / Math.max(bw, bh)));
      const offsetX = (0.5 - cx) * 100;
      const offsetY = (0.5 - cy) * 100;
      video.style.transform = `scale(${zoomFactor.toFixed(2)}) translate(${offsetX.toFixed(1)}%, ${offsetY.toFixed(1)}%)`;
    }

    function resetToWideOverview() {
      isZoomedIn = false;
      bboxOverlay.style.display = 'none';
      stageBadge.textContent = 'Wide Overview';
      const baseZ = parseFloat(zoomSlider.value) || 0.75;
      applyBaseZoom(baseZ);
      setTimeout(() => { lastFrameData = null; }, 400);
    }

    function checkMotionLoop() {
      if (isBusy || isZoomedIn || video.readyState < 2) return;

      const ctx = diffCanvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, diffCanvas.width, diffCanvas.height);
      const current = ctx.getImageData(0, 0, diffCanvas.width, diffCanvas.height).data;

      if (!lastFrameData) {
        lastFrameData = current;
        return;
      }

      const sens = parseInt(sensitivitySlider.value, 10) || 5;
      const pixelDiffThreshold = 85 - sens * 5;
      const changedRatioThreshold = 0.055 - sens * 0.004;

      let changed = 0;
      const total = diffCanvas.width * diffCanvas.height;
      for (let i = 0; i < current.length; i += 4) {
        const d =
          Math.abs(current[i] - lastFrameData[i]) +
          Math.abs(current[i + 1] - lastFrameData[i + 1]) +
          Math.abs(current[i + 2] - lastFrameData[i + 2]);
        if (d > pixelDiffThreshold) changed++;
      }

      const ratio = changed / total;
      lastFrameData = current;

      if (ratio > Math.max(0.008, changedRatioThreshold)) {
        setStatus('Change seen, settling...', '#facc15');
        clearTimeout(settleTimer);
        settleTimer = setTimeout(() => {
          if (!isBusy) runFullCycle();
        }, 1500);
      } else if (!settleTimer && statusPill.textContent !== 'Error') {
        setStatus('Watching screen', '#4ade80');
      }
    }

    function captureCropBase64(box = null, maxDim = 1600, quality = 0.88) {
      const vw = video.videoWidth || 1600;
      const vh = video.videoHeight || 1200;

      let sx = 0, sy = 0, sw = vw, sh = vh;
      if (box) {
        sx = Math.max(0, Math.floor(box.x1 * vw));
        sy = Math.max(0, Math.floor(box.y1 * vh));
        sw = Math.min(vw - sx, Math.ceil((box.x2 - box.x1) * vw));
        sh = Math.min(vh - sy, Math.ceil((box.y2 - box.y1) * vh));
      }

      const scale = Math.min(1, maxDim / Math.max(sw, sh));
      captureCanvas.width = Math.max(64, Math.round(sw * scale));
      captureCanvas.height = Math.max(64, Math.round(sh * scale));

      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, captureCanvas.width, captureCanvas.height);
      return captureCanvas.toDataURL('image/jpeg', quality).split(',').pop();
    }

    async function callClaude(systemPrompt, userText, base64Jpeg, maxTokens = 300) {
      const apiKey = (localStorage.getItem('csw_api_key') || '').trim();
      const model = localStorage.getItem('csw_model') || 'claude-sonnet-4-6';

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: model,
          max_tokens: maxTokens,
          system: systemPrompt,
          messages: [
            {
              role: 'user',
              content: [
                {
                  type: 'image',
                  source: {
                    type: 'base64',
                    media_type: 'image/jpeg',
                    data: base64Jpeg
                  }
                },
                {
                  type: 'text',
                  text: userText
                }
              ]
            }
          ]
        })
      });

      const rawText = await response.text();
      let data = null;
      try { data = JSON.parse(rawText); } catch (e) {}

      if (!response.ok) {
        const errType = data?.error?.type ? ` (${data.error.type})` : '';
        const errMsg = data?.error?.message || rawText || `HTTP ${response.status}`;
        throw new Error(`HTTP ${response.status}${errType}: ${errMsg}`);
      }

      const textBlock = Array.isArray(data?.content)
        ? data.content.find(block => block.type === 'text')
        : null;
      return (textBlock?.text || '').trim();
    }

    function parseAllTextBoundingBox(rawJson) {
      try {
        const cleaned = rawJson.replace(/```json|```/gi, '').trim();
        const match = cleaned.match(/\{[\s\S]*\}/);
        if (!match) return null;
        const obj = JSON.parse(match[0]);
        if (!obj.has_content) return null;

        let x1 = Number(obj.x1);
        let y1 = Number(obj.y1);
        let x2 = Number(obj.x2);
        let y2 = Number(obj.y2);

        if ([x1, y1, x2, y2].some(n => Number.isNaN(n))) return null;

        // Generous 8% margin around the entire detected text region so nothing gets clipped
        const pad = 0.08;
        x1 = Math.max(0, Math.min(0.85, x1 - pad));
        y1 = Math.max(0, Math.min(0.85, y1 - pad));
        x2 = Math.min(1, Math.max(x1 + 0.15, x2 + pad));
        y2 = Math.min(1, Math.max(y1 + 0.15, y2 + pad));

        return { x1, y1, x2, y2 };
      } catch (e) {
        return null;
      }
    }

    async function runFullCycle() {
      if (isBusy || video.readyState < 2) return;
      isBusy = true;
      clearTimeout(settleTimer);
      settleTimer = null;
      clearError();

      try {
        // Stage 1: Wide scan to enclose ALL readable word/text content on the monitor
        setStatus('Locating all content...', '#facc15');
        const wideB64 = captureCropBase64(null, 1024, 0.80);

        const locateSystem =
          'You locate the ENTIRE block of readable word and text content on a computer monitor. ' +
          'Return ONLY valid JSON with normalized coordinates from 0.0 to 1.0: ' +
          '{"has_content": true, "x1": 0.05, "y1": 0.05, "x2": 0.95, "y2": 0.95}. ' +
          'CRITICAL RULES: ' +
          '1. Enclose ALL visible text, paragraphs, passages, headings, questions, and answer options on the screen from the very first line at the top to the very last line at the bottom. ' +
          '2. NEVER narrow down to a single paragraph, single bullet, or single section—capture the full union of all text content on the monitor. ' +
          '3. Only exclude empty desk space, monitor bezels, or blank margins outside the content area. ' +
          '4. If there is no readable text on screen, return {"has_content": false}.';

        const locateRaw = await callClaude(
          locateSystem,
          'Return the JSON bounding box enclosing ALL readable word content on the monitor from top to bottom and left to right.',
          wideB64,
          140
        );

        const box = parseAllTextBoundingBox(locateRaw);
        if (!box) {
          setStatus('No text found', '#a3a3a3');
          resetToWideOverview();
          isBusy = false;
          return;
        }

        // Stage 2: Zoom into the entire text region for a high-resolution read
        setStatus('Zooming & reading...', '#38bdf8');
        zoomIntoBox(box);
        await new Promise(r => setTimeout(r, 320));

        const zoomedB64 = captureCropBase64(box, 1900, 0.90);

        // Stage 3: Sort through where questions begin/end and answer ONLY the completely visible question
        const answerSystem =
          'You are reading a high-resolution capture of all text content on a computer monitor. ' +
          'Sort through the full text from top to bottom to identify where each question begins and ends. ' +
          'STRICT RULES:
' +
          '1. Ignore any partial or cut-off question at the top or bottom edge whose full question text or full set of answer choices is not completely visible on the screen.
' +
          '2. Identify the question that is COMPLETELY visible on the screen from start to finish (if more than one complete question is visible, answer the main or newest complete one).
' +
          '3. Output ONLY the direct, final answer to that completely visible question (if multiple-choice, give the choice letter and exact option text).
' +
          '4. NEVER repeat, quote, or summarize the question, and NEVER include explanations, commentary, or lead-in phrases.
' +
          '5. If there is NO completely visible question on the screen, reply with the exact word NONE.';

        const finalReply = await callClaude(
          answerSystem,
          'Sort through where each question begins and ends. Answer ONLY the question that is completely visible on the screen, with zero summary or repetition. Reply NONE if no complete question is visible.',
          zoomedB64,
          350
        );

        if (finalReply && finalReply.toUpperCase() !== 'NONE') {
          answerText.classList.remove('placeholder');
          answerText.textContent = finalReply;
          setStatus('Answered', '#4ade80');

          if (finalReply !== lastAnswer) {
            lastAnswer = finalReply;
            if (vibrateChk.checked && navigator.vibrate) navigator.vibrate(120);
            if (beepChk.checked) playBeep();
          }
        } else {
          setStatus('No complete question', '#a3a3a3');
        }
      } catch (err) {
        showError(err.message);
      } finally {
        setTimeout(() => {
          resetToWideOverview();
          isBusy = false;
        }, 500);
      }
    }
  </script>
</body>
</html>
