<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Claude Screen Watcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Setup Screen */
    #setup-screen {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
      height: 100%;
      overflow-y: auto;
    }
    h1 { font-size: 1.4rem; color: #f5f5f5; }
    p.sub { font-size: 0.9rem; color: #aaaaaa; line-height: 1.35; }
    label { font-size: 0.82rem; color: #cccccc; margin-bottom: -6px; }
    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #141414;
      color: #fff;
      font-size: 1rem;
    }
    button.primary {
      background: #d97757;
      color: #000;
      font-weight: 700;
      border: none;
      margin-top: 6px;
      cursor: pointer;
    }
    #setup-error {
      display: none;
      background: #450a0a;
      border: 1px solid #ef4444;
      color: #fecaca;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      word-break: break-word;
    }

    /* Active Watcher Layout: Answer Top -> Controls & Error Middle -> Camera Bottom */
    #watcher-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* Top Answer Box */
    #answer-container {
      flex: 1.15;
      min-height: 140px;
      padding: 18px 18px;
      overflow-y: auto;
      display: flex;
      background: #050505;
      border-bottom: 1px solid #222;
    }
    /* margin:auto centers the answer when it fits. Unlike align-items:center, it lets a
       too-tall answer start at the top (scrollable) instead of pushing its start out of view. */
    #answer-box {
      margin: auto;
      width: 100%;
      text-align: center;
      transition: opacity 0.2s;
    }
    #answer-box.stale { opacity: 0.28; }
    #answer-main {
      font-size: clamp(2.4rem, 9vw, 4.5rem);
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      word-break: break-word;
    }
    /* Answer text under the letter: smaller, and never more than 2 lines */
    #answer-detail {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.25;
      color: #d4d4d4;
      word-break: break-word;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
    }
    #answer-detail:empty { display: none; }
    .placeholder {
      font-size: clamp(1.3rem, 4.5vw, 2rem) !important;
      color: #444444 !important;
      font-weight: 500 !important;
    }

    /* Middle Controls & Full Unwrapped Error Banner */
    #controls-section {
      background: #111111;
      border-bottom: 1px solid #222;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    #status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #status-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: #4ade80;
    }
    #diff-badge {
      font-size: 0.78rem;
      color: #a3a3a3;
      background: #1c1c1c;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #2e2e2e;
      flex-shrink: 0;
    }
    #button-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .ctrl-btn {
      padding: 9px 4px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #202020;
      border: 1px solid #353535;
      color: #e5e5e5;
      border-radius: 8px;
      cursor: pointer;
    }
    .ctrl-btn.stop {
      background: #2a1215;
      border-color: #5c1d24;
      color: #fca5a5;
    }
    #error-banner {
      display: none;
      width: 100%;
      background: #450a0a;
      border: 1px solid #ef4444;
      color: #fecaca;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* Settings Drawer */
    #settings-drawer {
      display: none;
      background: #161616;
      border-bottom: 1px solid #2c2c2c;
      padding: 10px 12px;
      flex-direction: column;
      gap: 8px;
      font-size: 0.82rem;
    }
    .setting-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .setting-line input[type="range"] {
      width: 52%;
      padding: 0;
    }
    .drawer-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .drawer-actions button {
      padding: 8px;
      font-size: 0.8rem;
    }

    /* Bottom Camera View */
    #camera-section {
      flex: 1;
      min-height: 160px;
      background: #000000;
      display: flex;
      flex-direction: column;
      padding: 8px 12px 10px 12px;
      gap: 6px;
      overflow: hidden;
    }
    #video-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      background: #080808;
      border: 1px solid #2b2b2b;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center center;
    }
    #crop-overlay {
      position: absolute;
      border: 2px solid #facc15;
      background: rgba(250, 204, 21, 0.12);
      pointer-events: none;
      display: none;
      border-radius: 4px;
    }
    #zoom-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #zoom-label {
      font-size: 0.78rem;
      color: #bbbbbb;
      min-width: 66px;
    }
    #zoom-slider {
      flex: 1;
      padding: 0;
    }
    #lens-btn {
      width: auto;
      padding: 7px 10px;
      font-size: 0.76rem;
      background: #1f1f1f;
      border: 1px solid #383838;
      color: #e5e5e5;
      border-radius: 8px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Setup Screen -->
  <div id="setup-screen">
    <h1>Claude Screen Watcher</h1>
    <p class="sub">Your API key stays saved locally in your phone's browser storage and is never sent anywhere except Anthropic.</p>

    <label for="api-key">Anthropic API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />

    <label for="model-select">Claude Model</label>
    <select id="model-select">
      <option value="claude-haiku-5-5">Claude Haiku 5.5 (Fastest &amp; Lowest Cost)</option>
      <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (More Accurate, Slower)</option>
    </select>

    <button type="button" class="primary" id="start-btn" onclick="handleStartClick()">Start Watching</button>
    <div id="setup-error"></div>
  </div>

  <!-- Active Watcher Screen -->
  <div id="watcher-screen">
    <!-- Top: Direct Answer -->
    <div id="answer-container">
      <div id="answer-box">
        <div id="answer-main" class="placeholder">Waiting for question...</div>
        <div id="answer-detail"></div>
      </div>
    </div>

    <!-- Middle: Status, Controls, Error Banner -->
    <div id="controls-section">
      <div id="status-row">
        <span id="status-text">Starting rear camera...</span>
        <span id="diff-badge">Diff: 0.0%</span>
      </div>

      <div id="button-row">
        <button type="button" class="ctrl-btn" id="read-now-btn" onclick="forceReadNow()">Read now</button>
        <button type="button" class="ctrl-btn" id="hide-cam-btn" onclick="toggleCameraView()">Hide cam</button>
        <button type="button" class="ctrl-btn" id="settings-btn" onclick="toggleSettings()">Settings</button>
        <button type="button" class="ctrl-btn stop" id="stop-btn" onclick="stopWatching()">Stop</button>
      </div>

      <div id="error-banner"></div>
    </div>

    <!-- Collapsible Settings Drawer -->
    <div id="settings-drawer">
      <div class="setting-line">
        <span>Change Threshold: <strong id="sens-val">1.2%</strong></span>
        <input type="range" id="sens-slider" min="0.5" max="5.0" step="0.1" value="1.2" oninput="updateSensLabel()" />
      </div>
      <div class="setting-line">
        <span>Auto-Crop Margin: <strong id="margin-val">12%</strong></span>
        <input type="range" id="margin-slider" min="5" max="25" step="1" value="12" oninput="updateMarginLabel()" />
      </div>
      <div class="setting-line">
        <span>Reads per question: <strong id="reads-val">1</strong></span>
        <input type="range" id="reads-slider" min="1" max="3" step="1" value="1" oninput="updateReadsLabel()" />
      </div>
      <div class="setting-line">
        <span>Answer text size: <strong id="textsize-val">22px</strong></span>
        <input type="range" id="textsize-slider" min="14" max="48" step="1" value="22" oninput="updateTextSize()" />
      </div>
      <div class="drawer-actions">
        <button type="button" class="ctrl-btn" onclick="rescanRearLenses()">Re-Scan Rear Lenses</button>
        <button type="button" class="ctrl-btn stop" onclick="forgetApiKey()">Forget Saved Key</button>
      </div>
    </div>

    <!-- Bottom: Rear Camera Preview & Zoom -->
    <div id="camera-section">
      <div id="video-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <div id="crop-overlay"></div>
      </div>
      <div id="zoom-bar">
        <span id="zoom-label">Zoom: 1.00x</span>
        <input type="range" id="zoom-slider" min="0.25" max="2.50" step="0.05" value="1.00" oninput="onZoomChange()" />
        <button type="button" id="lens-btn" onclick="cycleRearLens()">Rear Lens (1/1)</button>
      </div>
    </div>
  </div>

  <canvas id="diff-canvas" width="160" height="120" style="display:none;"></canvas>
  <canvas id="capture-canvas" style="display:none;"></canvas>

  <script>
    var currentStream = null;
    var watchInterval = null;
    var isBusy = false;
    var wakeLockObj = null;
    var rearCameras = [];
    var activeRearIdx = 0;
    var camHidden = false;
    var hwZoomMin = 1.0;
    var hwZoomMax = 1.0;
    var hwZoomSupported = false;
    var cssScale = 1.0;          // zoom applied with CSS when the camera has no hardware zoom
    var pipelineRunId = 0;       // bumped by Stop so in-flight work knows to quit

    // Change detection state. Frames are small 160x120 brightness maps ("luma").
    var baselineLuma = null;     // the screen as it looked when the last answer was read
    var prevLuma = null;         // the previous poll's frame, used to tell when the screen has settled
    var settling = false;
    var stableSince = 0;

    // Saved screen location
    var cropBox = null;          // [x1,y1,x2,y2] of the text on the monitor, 0..1 within the camera view
    var boxRefLuma = null;       // frame from when cropBox was last confirmed, for the camera-moved check

    // Tuning
    var POLL_MS = 250;
    var SETTLE_MS = 1000;             // screen must hold still this long before anything is sent
    var PIXEL_DELTA = 22;             // brightness change that counts a pixel as changed
    var CAMERA_MOVE_PCT = 10;         // % of pixels outside the crop that must change to count as a bump
    var MIN_OUTSIDE_FRACTION = 0.08;  // need this much of the view outside the crop to run the bump check
    var MAX_TEXT_CHANGE = 0.20;       // with 2 or 3 reads: over 20% word difference starts the count over
    var MAX_VERIFY_RESTARTS = 3;      // give up after this many restarts
    var MAX_API_RETRIES = 2;          // retries for rate-limit, overload and network errors
    var DEFAULT_MODEL = "claude-haiku-5-5";

    var LOCATE_SYS = "You locate the entire block of readable text content on a computer monitor photo. Return ONLY four comma-separated normalized coordinates x1,y1,x2,y2 between 0.0 and 1.0 enclosing ALL readable text and answer choices from top-left to bottom-right. Example: 0.05,0.10,0.95,0.90. If no readable text exists, return 0,0,1,1.";
    var LOCATE_USER = "Return x1,y1,x2,y2 for all readable content on this monitor.";

    var SOLVE_SYS = [
      "You read a photo of a computer monitor showing a quiz question and give the answer.",
      "1. Find the one question that is completely visible together with all of its answer choices. Ignore any question cut off at the top or bottom edge.",
      "2. In <question></question>, transcribe that question and its answer choices exactly as shown. If no complete question is visible, write NONE there.",
      "3. In <work></work>, reason briefly to find the correct answer. Keep it short.",
      "4. In <letter></letter>, put only the capital letter of the correct choice if the choices are labeled with letters (A, B, C, D... or a, b, c, d...). Leave it empty if the choices have no letter labels.",
      "5. In <answer></answer>, put the correct answer as a short label of 5 words or fewer, for example: Jupiter. Do not repeat the letter there. If no complete question is visible, write NONE.",
      "Output only these four tagged sections, in this order."
    ].join("\n");
    var SOLVE_USER = "Answer the complete question on this monitor.";

    function safeGetStorage(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function safeSetStorage(key, val) {
      try {
        window.localStorage.setItem(key, val);
      } catch (e) {}
    }

    function safeRemoveStorage(key) {
      try {
        window.localStorage.removeItem(key);
      } catch (e) {}
    }

    function isKnownModel(m) {
      if (!m) return false;
      var opts = document.getElementById("model-select").options;
      for (var i = 0; i < opts.length; i++) {
        if (opts[i].value === m) return true;
      }
      return false;
    }

    function getModel() {
      var m = safeGetStorage("csw_model");
      return isKnownModel(m) ? m : DEFAULT_MODEL;
    }

    (function initSavedValues() {
      var k = safeGetStorage("csw_api_key");
      var m = safeGetStorage("csw_model");
      var s = safeGetStorage("csw_sens");
      var mg = safeGetStorage("csw_margin");
      var rd = safeGetStorage("csw_reads");
      var ts = safeGetStorage("csw_textsize");
      if (k) document.getElementById("api-key").value = k;
      // Older versions saved model names that no longer exist; drop those
      if (m && isKnownModel(m)) {
        document.getElementById("model-select").value = m;
      } else if (m) {
        safeRemoveStorage("csw_model");
      }
      if (s) {
        document.getElementById("sens-slider").value = s;
        document.getElementById("sens-val").textContent = parseFloat(s).toFixed(1) + "%";
      }
      if (mg) {
        document.getElementById("margin-slider").value = mg;
        document.getElementById("margin-val").textContent = mg + "%";
      }
      if (rd) {
        document.getElementById("reads-slider").value = rd;
        document.getElementById("reads-val").textContent = String(getReadsPerQuestion());
      }
      if (ts) document.getElementById("textsize-slider").value = ts;
      applyTextSize();
    })();

    function showSetupError(msg) {
      var el = document.getElementById("setup-error");
      el.textContent = msg;
      el.style.display = "block";
    }

    function showBannerError(msg) {
      var banner = document.getElementById("error-banner");
      banner.textContent = msg;
      banner.style.display = "block";
      setStatus("Error", "#f87171");
    }

    function clearBannerError() {
      var banner = document.getElementById("error-banner");
      banner.textContent = "";
      banner.style.display = "none";
    }

    function setStatus(text, color) {
      var st = document.getElementById("status-text");
      st.textContent = text;
      st.style.color = color || "#4ade80";
    }

    function setAnswerStale(isStale) {
      var box = document.getElementById("answer-box");
      if (isStale) box.classList.add("stale");
      else box.classList.remove("stale");
    }

    function showAnswer(res) {
      var main = document.getElementById("answer-main");
      var detail = document.getElementById("answer-detail");
      main.classList.remove("placeholder");
      if (res.letter) {
        main.textContent = res.letter;
        detail.textContent = res.answer || "";
      } else {
        main.textContent = res.answer;
        detail.textContent = "";
      }
      setAnswerStale(false);
      document.getElementById("answer-container").scrollTop = 0;
    }

    function requestScreenWakeLock() {
      try {
        if (navigator.wakeLock && navigator.wakeLock.request) {
          navigator.wakeLock.request("screen").then(function(wl) {
            wakeLockObj = wl;
          }).catch(function() {});
        }
      } catch (e) {}
    }

    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "visible" && document.getElementById("watcher-screen").style.display === "flex") {
        requestScreenWakeLock();
      }
    });

    function handleStartClick() {
      try {
        var keyInput = document.getElementById("api-key");
        var key = (keyInput.value || "").replace(/\s+/g, "");
        if (!key) {
          showSetupError("Please paste your Anthropic API key (starts with sk-ant-).");
          return;
        }
        document.getElementById("setup-error").style.display = "none";
        safeSetStorage("csw_api_key", key);
        safeSetStorage("csw_model", document.getElementById("model-select").value);

        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("watcher-screen").style.display = "flex";

        requestScreenWakeLock();
        discoverAndSelectBestRearLens();
      } catch (err) {
        showSetupError("Startup error: " + (err && err.message ? err.message : String(err)));
      }
    }

    function stopWatching() {
      if (watchInterval) clearInterval(watchInterval);
      watchInterval = null;
      pipelineRunId++; // cancels any read still in flight
      isBusy = false;
      forgetScreenLocation();
      stopCurrentStream();
      document.getElementById("watcher-screen").style.display = "none";
      document.getElementById("setup-screen").style.display = "flex";
    }

    function stopCurrentStream() {
      if (currentStream) {
        var tracks = currentStream.getTracks();
        for (var i = 0; i < tracks.length; i++) {
          tracks[i].stop();
        }
        currentStream = null;
      }
    }

    // Throw away the saved crop box and reference frames. Used whenever the view changes
    // (new lens, zoom change, restart) so nothing compares against a stale picture.
    function forgetScreenLocation() {
      cropBox = null;
      boxRefLuma = null;
      baselineLuma = null;
      prevLuma = null;
      settling = false;
      stableSince = 0;
    }

    function toggleCameraView() {
      camHidden = !camHidden;
      var camSec = document.getElementById("camera-section");
      var btn = document.getElementById("hide-cam-btn");
      if (camHidden) {
        camSec.style.display = "none";
        btn.textContent = "Show cam";
      } else {
        camSec.style.display = "flex";
        btn.textContent = "Hide cam";
      }
    }

    function toggleSettings() {
      var drawer = document.getElementById("settings-drawer");
      drawer.style.display = (drawer.style.display === "flex") ? "none" : "flex";
    }

    function getThreshold() {
      return parseFloat(document.getElementById("sens-slider").value) || 1.2;
    }

    function updateSensLabel() {
      var v = document.getElementById("sens-slider").value;
      document.getElementById("sens-val").textContent = parseFloat(v).toFixed(1) + "%";
      safeSetStorage("csw_sens", v);
    }

    function updateMarginLabel() {
      var v = document.getElementById("margin-slider").value;
      document.getElementById("margin-val").textContent = v + "%";
      safeSetStorage("csw_margin", v);
    }

    function getReadsPerQuestion() {
      var v = parseInt(document.getElementById("reads-slider").value, 10);
      return (v >= 1 && v <= 3) ? v : 1;
    }

    function updateReadsLabel() {
      var v = getReadsPerQuestion();
      document.getElementById("reads-val").textContent = String(v);
      safeSetStorage("csw_reads", String(v));
    }

    function applyTextSize() {
      var v = parseInt(document.getElementById("textsize-slider").value, 10) || 22;
      document.getElementById("answer-detail").style.fontSize = v + "px";
      document.getElementById("textsize-val").textContent = v + "px";
    }

    function updateTextSize() {
      applyTextSize();
      safeSetStorage("csw_textsize", document.getElementById("textsize-slider").value);
    }

    function forgetApiKey() {
      safeRemoveStorage("csw_api_key");
      document.getElementById("api-key").value = "";
      stopWatching();
    }

    function isFrontCameraLabel(label) {
      if (!label) return false;
      var low = label.toLowerCase();
      return (
        low.indexOf("front") !== -1 ||
        low.indexOf("user") !== -1 ||
        low.indexOf("selfie") !== -1 ||
        low.indexOf("facetime") !== -1 ||
        low.indexOf("truedepth") !== -1
      );
    }

    function openCameraWithConstraints(constraints) {
      stopCurrentStream();
      return navigator.mediaDevices.getUserMedia(constraints).then(function(stream) {
        var tracks = stream.getVideoTracks();
        if (tracks.length > 0 && tracks[0].getSettings) {
          var st = tracks[0].getSettings();
          if (st.facingMode === "user") {
            tracks[0].stop();
            throw new Error("Front camera rejected");
          }
        }
        currentStream = stream;
        var video = document.getElementById("video");
        video.srcObject = stream;
        return video.play().then(function() {
          configureZoomCapabilities();
          return stream;
        });
      });
    }

    function configureZoomCapabilities() {
      hwZoomSupported = false;
      hwZoomMin = 1.0;
      hwZoomMax = 1.0;
      if (!currentStream) return;
      var tracks = currentStream.getVideoTracks();
      if (!tracks || tracks.length === 0) return;
      var track = tracks[0];
      if (track.getCapabilities) {
        var caps = track.getCapabilities();
        if (caps && caps.zoom && typeof caps.zoom.min === "number") {
          hwZoomSupported = true;
          hwZoomMin = caps.zoom.min;
          hwZoomMax = caps.zoom.max;
          var slider = document.getElementById("zoom-slider");
          if (hwZoomMin < 0.25) slider.min = hwZoomMin.toFixed(2);
          if (hwZoomMin < 1.0) {
            slider.value = hwZoomMin.toFixed(2);
            applyZoomValue(hwZoomMin);
            return;
          }
        }
      }
      applyZoomValue(parseFloat(document.getElementById("zoom-slider").value) || 1.0);
    }

    function onZoomChange() {
      var val = parseFloat(document.getElementById("zoom-slider").value) || 1.0;
      applyZoomValue(val);
    }

    function applyZoomValue(val) {
      document.getElementById("zoom-label").textContent = "Zoom: " + val.toFixed(2) + "x";
      var video = document.getElementById("video");
      cssScale = val;
      if (hwZoomSupported && currentStream) {
        var tracks = currentStream.getVideoTracks();
        if (tracks && tracks.length > 0 && tracks[0].applyConstraints) {
          var clamped = Math.max(hwZoomMin, Math.min(hwZoomMax, val));
          tracks[0].applyConstraints({ advanced: [{ zoom: clamped }] }).catch(function() {});
          if (val >= hwZoomMin) cssScale = 1.0;
        }
      }
      video.style.transform = "scale(" + cssScale + ")";
      // The view changed, so the saved screen location no longer applies
      forgetScreenLocation();
    }

    // The part of the camera frame that the preview shows, in video pixels. When zoom is done
    // with CSS, this is the center of the frame, so what gets sent matches what you see.
    function getViewRect() {
      var video = document.getElementById("video");
      var vw = video.videoWidth || 1280;
      var vh = video.videoHeight || 960;
      var z = Math.max(1, cssScale);
      var w = vw / z;
      var h = vh / z;
      return { x: (vw - w) / 2, y: (vh - h) / 2, w: w, h: h };
    }

    // Where that same view sits on screen inside the preview box, in CSS pixels
    function getDisplayedViewRect() {
      var wrap = document.getElementById("video-wrapper");
      var video = document.getElementById("video");
      var W = wrap.clientWidth || 1;
      var H = wrap.clientHeight || 1;
      var a = (video.videoWidth || 4) / (video.videoHeight || 3);
      var cw, ch;
      if (W / H > a) { ch = H; cw = H * a; } else { cw = W; ch = W / a; }
      if (cssScale < 1) { cw *= cssScale; ch *= cssScale; }
      return { left: (W - cw) / 2, top: (H - ch) / 2, width: cw, height: ch };
    }

    function scoreCurrentFrameSharpnessAndCoverage() {
      var video = document.getElementById("video");
      if (!video || video.readyState < 2) return 0;
      var c = document.getElementById("diff-canvas");
      var w = c.width;
      var h = c.height;
      var ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, w, h);
      var data = ctx.getImageData(0, 0, w, h).data;
      var edgeEnergy = 0;
      var brightPixels = 0;
      for (var y = 1; y < h - 1; y++) {
        for (var x = 1; x < w - 1; x++) {
          var idx = (y * w + x) * 4;
          var lum = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
          if (lum > 45 && lum < 245) brightPixels++;
          var rightIdx = idx + 4;
          var downIdx = idx + w * 4;
          var lumR = (data[rightIdx] + data[rightIdx + 1] + data[rightIdx + 2]) / 3;
          var lumD = (data[downIdx] + data[downIdx + 1] + data[downIdx + 2]) / 3;
          edgeEnergy += Math.abs(lum - lumR) + Math.abs(lum - lumD);
        }
      }
      return edgeEnergy + brightPixels * 2;
    }

    function discoverAndSelectBestRearLens() {
      clearBannerError();
      setStatus("Finding best rear lens...", "#facc15");

      openCameraWithConstraints({
        video: {
          facingMode: { exact: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1440 }
        },
        audio: false
      }).catch(function() {
        return openCameraWithConstraints({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1440 }
          },
          audio: false
        });
      }).then(function() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          rearCameras = [];
          updateLensButtonText();
          startWatchLoop();
          return;
        }
        return navigator.mediaDevices.enumerateDevices().then(function(devices) {
          var filtered = [];
          for (var i = 0; i < devices.length; i++) {
            var d = devices[i];
            if (d.kind === "videoinput" && !isFrontCameraLabel(d.label)) {
              filtered.push(d);
            }
          }
          // Sort to prioritize ultra-wide / 0.5x / wide rear lenses first
          filtered.sort(function(a, b) {
            var la = (a.label || "").toLowerCase();
            var lb = (b.label || "").toLowerCase();
            var scoreA = (la.indexOf("ultra") !== -1 || la.indexOf("0.5") !== -1) ? 0 : (la.indexOf("wide") !== -1 || la.indexOf("back") !== -1 ? 1 : 2);
            var scoreB = (lb.indexOf("ultra") !== -1 || lb.indexOf("0.5") !== -1) ? 0 : (lb.indexOf("wide") !== -1 || lb.indexOf("back") !== -1 ? 1 : 2);
            return scoreA - scoreB;
          });

          rearCameras = filtered;
          if (rearCameras.length <= 1) {
            activeRearIdx = 0;
            updateLensButtonText();
            startWatchLoop();
            return;
          }

          // Test up to 3 rear candidates to pick the clearest full-screen view
          var maxTest = Math.min(3, rearCameras.length);
          var bestIdx = 0;
          var bestScore = -1;
          var testIdx = 0;

          function testNextLens() {
            if (testIdx >= maxTest) {
              activeRearIdx = bestIdx;
              return switchToRearIndex(activeRearIdx).then(function() {
                updateLensButtonText();
                startWatchLoop();
              });
            }
            var candidate = rearCameras[testIdx];
            openCameraWithConstraints({
              video: {
                deviceId: { exact: candidate.deviceId },
                width: { ideal: 1920 },
                height: { ideal: 1440 }
              },
              audio: false
            }).then(function() {
              setTimeout(function() {
                var sc = scoreCurrentFrameSharpnessAndCoverage();
                var lbl = (candidate.label || "").toLowerCase();
                if (lbl.indexOf("ultra") !== -1 || lbl.indexOf("0.5") !== -1) {
                  sc = sc * 1.15;
                }
                if (sc > bestScore) {
                  bestScore = sc;
                  bestIdx = testIdx;
                }
                testIdx++;
                testNextLens();
              }, 350);
            }).catch(function() {
              testIdx++;
              testNextLens();
            });
          }

          testNextLens();
        });
      }).catch(function(err) {
        showBannerError("Camera error: " + (err && err.message ? err.message : String(err)));
      });
    }

    function switchToRearIndex(idx) {
      if (!rearCameras || rearCameras.length === 0) return Promise.resolve();
      activeRearIdx = idx % rearCameras.length;
      var cam = rearCameras[activeRearIdx];
      updateLensButtonText();
      return openCameraWithConstraints({
        video: {
          deviceId: { exact: cam.deviceId },
          width: { ideal: 1920 },
          height: { ideal: 1440 }
        },
        audio: false
      });
    }

    function cycleRearLens() {
      if (!rearCameras || rearCameras.length <= 1) {
        discoverAndSelectBestRearLens();
        return;
      }
      setStatus("Switching rear lens...", "#facc15");
      switchToRearIndex(activeRearIdx + 1).then(function() {
        forgetScreenLocation();
        setStatus("Watching screen...", "#4ade80");
      }).catch(function(err) {
        showBannerError("Lens switch error: " + (err && err.message ? err.message : String(err)));
      });
    }

    function rescanRearLenses() {
      if (watchInterval) clearInterval(watchInterval);
      discoverAndSelectBestRearLens();
    }

    function updateLensButtonText() {
      var btn = document.getElementById("lens-btn");
      var total = rearCameras.length > 0 ? rearCameras.length : 1;
      var current = rearCameras.length > 0 ? (activeRearIdx + 1) : 1;
      btn.textContent = "Rear Lens (" + current + "/" + total + ")";
    }

    function startWatchLoop() {
      if (watchInterval) clearInterval(watchInterval);
      baselineLuma = null;
      prevLuma = null;
      settling = false;
      stableSince = 0;
      setStatus("Watching screen...", "#4ade80");
      watchInterval = setInterval(pollScreen, POLL_MS);
    }

    // Small brightness map of the current camera view (what the preview shows)
    function grabLumaFrame() {
      var video = document.getElementById("video");
      if (!video || video.readyState < 2) return null;
      var c = document.getElementById("diff-canvas");
      var w = c.width;
      var h = c.height;
      var ctx = c.getContext("2d", { willReadFrequently: true });
      var v = getViewRect();
      ctx.drawImage(video, v.x, v.y, v.w, v.h, 0, 0, w, h);
      var data = ctx.getImageData(0, 0, w, h).data;
      var luma = new Float32Array(w * h);
      for (var i = 0; i < luma.length; i++) {
        var p = i * 4;
        luma[i] = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
      }
      return luma;
    }

    // Percent of pixels that changed between two frames, optionally only where mask is 1.
    // Each frame is first scaled to the same average brightness over the compared pixels,
    // so the camera's auto-exposure adjusting doesn't count as a change.
    function diffPercent(a, b, mask) {
      if (!a || !b || a.length !== b.length) return 100;
      var sumA = 0, sumB = 0, n = 0, i;
      for (i = 0; i < a.length; i++) {
        if (mask && !mask[i]) continue;
        sumA += a[i];
        sumB += b[i];
        n++;
      }
      if (n === 0) return 0;
      var sa = 128 / Math.max(1, sumA / n);
      var sb = 128 / Math.max(1, sumB / n);
      var changed = 0;
      for (i = 0; i < a.length; i++) {
        if (mask && !mask[i]) continue;
        if (Math.abs(a[i] * sa - b[i] * sb) > PIXEL_DELTA) changed++;
      }
      return (changed / n) * 100;
    }

    // Grow the located box by the margin setting, with the original safety rules.
    // This is exactly the area that gets photographed and sent to Claude.
    function expandBox(box) {
      var margin = (parseFloat(document.getElementById("margin-slider").value) || 12) / 100.0;
      var x1 = Math.max(0, box[0] - margin);
      var y1 = Math.max(0, box[1] - margin);
      var x2 = Math.min(1, box[2] + margin);
      var y2 = Math.min(1, box[3] + margin);
      // Protect left-aligned text from clipping
      if (x1 < 0.22) x1 = 0;
      if (x2 - x1 < 0.25) { x1 = 0; x2 = 1; }
      if (y2 - y1 < 0.20) { y1 = 0; y2 = 1; }
      return [x1, y1, x2, y2];
    }

    // Mask of the pixels outside the crop (the wall, desk and monitor edge around the text).
    // Returns null when the crop covers nearly the whole view, since there is nothing to check.
    function outsideMask(box) {
      if (!box) return null;
      var r = expandBox(box);
      var c = document.getElementById("diff-canvas");
      var w = c.width;
      var h = c.height;
      var mask = new Uint8Array(w * h);
      var count = 0;
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          var nx = (x + 0.5) / w;
          var ny = (y + 0.5) / h;
          if (nx < r[0] || nx > r[2] || ny < r[1] || ny > r[3]) {
            mask[y * w + x] = 1;
            count++;
          }
        }
      }
      if (count < w * h * MIN_OUTSIDE_FRACTION) return null;
      return mask;
    }

    // A new question only changes pixels inside the monitor. A bump shifts everything,
    // including the area around it. If that outside area changed, assume the camera moved.
    function cameraMoved(refLuma, nowLuma) {
      var mask = outsideMask(cropBox);
      if (!mask) return false; // crop is already nearly the whole view; self-repair covers this case
      return diffPercent(nowLuma, refLuma, mask) > CAMERA_MOVE_PCT;
    }

    function setDiffBadge(pct) {
      document.getElementById("diff-badge").textContent = "Diff: " + pct.toFixed(1) + "%";
    }

    // Runs every POLL_MS. Free, on-phone change detection:
    // 1) compare to the last answered screen; if it changed, gray out the answer and start settling
    // 2) while settling, compare each frame to the previous one; once it holds still for SETTLE_MS, read it
    function pollScreen() {
      if (isBusy) return;
      var curr = grabLumaFrame();
      if (!curr) return;

      if (!baselineLuma) {
        baselineLuma = curr;
        prevLuma = curr;
        return;
      }

      var thr = getThreshold();

      if (!settling) {
        var pct = diffPercent(curr, baselineLuma, null);
        setDiffBadge(pct);
        prevLuma = curr;
        if (pct >= thr) {
          settling = true;
          stableSince = 0;
          setAnswerStale(true);
          setStatus("Change detected, settling...", "#facc15");
        }
        return;
      }

      var step = prevLuma ? diffPercent(curr, prevLuma, null) : 100;
      setDiffBadge(step);
      prevLuma = curr;
      if (step >= thr) {
        stableSince = 0;
        return;
      }
      var now = Date.now();
      if (!stableSince) {
        stableSince = now;
        return;
      }
      if (now - stableSince >= SETTLE_MS) {
        settling = false;
        stableSince = 0;
        runFullReadPipeline(false);
      }
    }

    function forceReadNow() {
      if (isBusy) return;
      settling = false;
      stableSince = 0;
      runFullReadPipeline(true);
    }

    // Photograph the current view (cropped to box, if given) and grab its brightness map
    // at the same moment, so later frames can be compared to exactly what was sent.
    function captureShot(box) {
      var video = document.getElementById("video");
      var v = getViewRect();
      var r = box ? expandBox(box) : [0, 0, 1, 1];

      var sx = Math.round(v.x + r[0] * v.w);
      var sy = Math.round(v.y + r[1] * v.h);
      var sw = Math.max(64, Math.round((r[2] - r[0]) * v.w));
      var sh = Math.max(64, Math.round((r[3] - r[1]) * v.h));

      var maxDim = 1400;
      var scale = Math.min(1, maxDim / Math.max(sw, sh));
      var cw = Math.round(sw * scale);
      var ch = Math.round(sh * scale);

      var canvas = document.getElementById("capture-canvas");
      canvas.width = cw;
      canvas.height = ch;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
      var luma = grabLumaFrame();

      var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      var parts = dataUrl.split(",");
      return { base64: parts[parts.length - 1], luma: luma };
    }

    // Shows exactly the area being sent, positioned over the preview
    function showCropBoxOverlay(box) {
      var overlay = document.getElementById("crop-overlay");
      if (!box || box.length !== 4) {
        overlay.style.display = "none";
        return;
      }
      var r = expandBox(box);
      var d = getDisplayedViewRect();
      overlay.style.left = (d.left + r[0] * d.width).toFixed(1) + "px";
      overlay.style.top = (d.top + r[1] * d.height).toFixed(1) + "px";
      overlay.style.width = ((r[2] - r[0]) * d.width).toFixed(1) + "px";
      overlay.style.height = ((r[3] - r[1]) * d.height).toFixed(1) + "px";
      overlay.style.display = "block";
    }

    function parseBox(str) {
      var cleaned = (str || "").replace(/[xy][12]\s*[=:]/gi, " ");
      var nums = cleaned.match(/\d*\.?\d+/g);
      if (!nums || nums.length < 4) return [0, 0, 1, 1];
      var b = [];
      for (var i = 0; i < 4; i++) {
        b.push(Math.max(0, Math.min(1, parseFloat(nums[i]))));
      }
      if (!(b[2] > b[0] && b[3] > b[1])) return [0, 0, 1, 1];
      return b;
    }

    function callClaudeVision(base64Img, systemPrompt, userPrompt, maxTokens, bail) {
      var apiKey = safeGetStorage("csw_api_key") || "";
      var body = JSON.stringify({
        model: getModel(),
        max_tokens: maxTokens || 350,
        system: systemPrompt,
        messages: [
          {
            role: "user",
            content: [
              {
                type: "image",
                source: {
                  type: "base64",
                  media_type: "image/jpeg",
                  data: base64Img
                }
              },
              {
                type: "text",
                text: userPrompt
              }
            ]
          }
        ]
      });

      function attempt(n) {
        if (bail) bail();
        return fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: body
        }).then(function(resp) {
          return resp.json().catch(function() { return {}; }).then(function(data) {
            return { resp: resp, data: data };
          });
        }, function(netErr) {
          return { netErr: netErr };
        }).then(function(r) {
          var retryable = false;
          var msg = "";
          if (r.netErr) {
            retryable = true;
            msg = "Network error: " + (r.netErr && r.netErr.message ? r.netErr.message : String(r.netErr));
          } else if (!r.resp.ok) {
            var s = r.resp.status;
            retryable = (s === 429 || s === 529 || s >= 500);
            var d = r.data || {};
            var errMsg = (d.error && d.error.message) ? d.error.message : ("HTTP " + s);
            var errType = (d.error && d.error.type) ? (" [" + d.error.type + "]") : "";
            msg = "API " + s + errType + ": " + errMsg;
          } else {
            var data = r.data;
            var textOut = "";
            if (data && data.content && data.content.length > 0) {
              for (var i = 0; i < data.content.length; i++) {
                if (data.content[i].type === "text") {
                  textOut += data.content[i].text;
                }
              }
            }
            return textOut.trim();
          }

          if (retryable && n < MAX_API_RETRIES) {
            if (bail) bail();
            var delay = n === 0 ? 1000 : 2500;
            var ra = (r.resp && r.resp.headers && r.resp.headers.get) ? parseFloat(r.resp.headers.get("retry-after")) : NaN;
            if (!isNaN(ra) && ra > 0) delay = Math.min(ra * 1000, 8000);
            setStatus("API busy, retrying (" + (n + 1) + "/" + MAX_API_RETRIES + ")...", "#facc15");
            return waitMs(delay).then(function() { return attempt(n + 1); });
          }
          throw new Error(msg);
        });
      }

      return attempt(0);
    }

    function extractTag(text, tag) {
      var m = (text || "").match(new RegExp("<" + tag + ">([\\s\\S]*?)</" + tag + ">", "i"));
      return m ? m[1].trim() : null;
    }

    function parseSolveResponse(text) {
      var question = extractTag(text, "question");
      var letterRaw = extractTag(text, "letter");
      var answer = extractTag(text, "answer");
      if (answer === null) {
        throw new Error("Could not read Claude's answer (the response was cut off or malformed).");
      }
      var none = !answer || answer.toUpperCase() === "NONE" || (question || "").toUpperCase() === "NONE";

      var letter = "";
      var lm = (letterRaw || "").match(/^\(?\s*([A-Za-z])\s*[\)\.\:]?$/);
      if (lm) letter = lm[1].toUpperCase();

      if (letter) {
        // Drop a leading "B) " or "B. " if Claude repeated the letter in the answer text
        answer = answer.replace(new RegExp("^\\(?" + letter + "[\\)\\.\\:]\\s*", "i"), "");
        if (answer.toUpperCase() === letter) answer = "";
      }
      return { question: question || "", letter: letter, answer: answer, none: none };
    }

    function computeWordSimilarity(a, b) {
      if (!a || !b) return 0;
      var wordsA = a.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(Boolean);
      var wordsB = b.toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(Boolean);
      if (wordsA.length === 0 || wordsB.length === 0) return 0;
      var freq = {};
      for (var i = 0; i < wordsA.length; i++) {
        freq[wordsA[i]] = (freq[wordsA[i]] || 0) + 1;
      }
      var matches = 0;
      for (var j = 0; j < wordsB.length; j++) {
        if (freq[wordsB[j]] > 0) {
          matches++;
          freq[wordsB[j]]--;
        }
      }
      return (2.0 * matches) / (wordsA.length + wordsB.length);
    }

    function waitMs(ms) {
      return new Promise(function(resolve) {
        setTimeout(resolve, ms);
      });
    }

    function runFullReadPipeline(force) {
      if (isBusy) return;
      isBusy = true;
      var runToken = ++pipelineRunId;
      function bailIfStopped() {
        if (runToken !== pipelineRunId) throw new Error("CANCELLED");
      }
      clearBannerError();

      var startLuma = grabLumaFrame();

      // Free check: if the settled screen looks the same as when the last answer was read
      // (glare, a hand passing by), send nothing and un-gray the current answer.
      if (!force && startLuma && baselineLuma && diffPercent(startLuma, baselineLuma, null) < getThreshold()) {
        setAnswerStale(false);
        setStatus("Watching (no real change)", "#4ade80");
        isBusy = false;
        return;
      }

      var locatedThisRun = false;
      var repairedThisRun = false;
      var reads = [];
      var restarts = 0;

      function locateScreen() {
        bailIfStopped();
        setStatus("Locating screen...", "#facc15");
        var shot = captureShot(null);
        return callClaudeVision(shot.base64, LOCATE_SYS, LOCATE_USER, 40, bailIfStopped).then(function(coordStr) {
          bailIfStopped();
          cropBox = parseBox(coordStr);
          boxRefLuma = shot.luma;
          locatedThisRun = true;
          showCropBoxOverlay(cropBox);
        });
      }

      // Reuse the saved crop box unless there is none yet or the camera looks like it moved
      function ensureScreenLocated(nowLuma) {
        if (cropBox && boxRefLuma && nowLuma && !cameraMoved(boxRefLuma, nowLuma)) {
          showCropBoxOverlay(cropBox);
          return Promise.resolve();
        }
        return locateScreen();
      }

      // One call: read the question, reason briefly, return the letter and a short answer
      function readOnce() {
        bailIfStopped();
        var total = getReadsPerQuestion();
        var label = total > 1 ? "Reading (" + (reads.length + 1) + "/" + total + ")" : "Reading and solving";
        if (restarts > 0) label += " [restart " + restarts + "/" + MAX_VERIFY_RESTARTS + "]";
        setStatus(label + "...", "#38bdf8");
        var shot = captureShot(cropBox);
        return callClaudeVision(shot.base64, SOLVE_SYS, SOLVE_USER, 1200, bailIfStopped).then(function(text) {
          bailIfStopped();
          var res = parseSolveResponse(text);
          res.shot = shot;
          return res;
        });
      }

      // With "Reads per question" at 2 or 3, every read must match all earlier reads within
      // MAX_TEXT_CHANGE, or the count starts over (finding the screen again if the camera moved).
      function readLoop() {
        return readOnce().then(function(res) {
          if (res.none) {
            // Self-repair: a saved crop box can be stale after a bump the outside check missed
            if (!locatedThisRun && !repairedThisRun) {
              repairedThisRun = true;
              reads = [];
              return locateScreen().then(readLoop);
            }
            return res;
          }

          for (var i = 0; i < reads.length; i++) {
            var change = 1 - computeWordSimilarity(reads[i].question, res.question);
            if (change > MAX_TEXT_CHANGE) {
              restarts++;
              if (restarts > MAX_VERIFY_RESTARTS) throw new Error("UNSTABLE");
              reads = [];
              setStatus("Text changed " + Math.round(change * 100) + "%, starting over...", "#facc15");
              return waitMs(650).then(function() {
                return ensureScreenLocated(grabLumaFrame());
              }).then(readLoop);
            }
          }

          reads.push(res);
          if (reads.length >= getReadsPerQuestion()) return res;
          return waitMs(400).then(readLoop);
        });
      }

      ensureScreenLocated(startLuma)
        .then(readLoop)
        .then(function(res) {
          bailIfStopped();
          showCropBoxOverlay(null);
          // Compare future frames to the moment this photo was taken, so a question that
          // appears while Claude is answering still counts as a change and gets read.
          baselineLuma = res.shot.luma;
          boxRefLuma = res.shot.luma;
          prevLuma = null;
          if (res.none) {
            setStatus("Watching (no complete question)", "#4ade80");
          } else {
            showAnswer(res);
            setStatus("Answer updated", "#4ade80");
          }
        })
        .catch(function(err) {
          if (err && err.message === "CANCELLED") return; // Stop was pressed; leave the UI alone
          showCropBoxOverlay(null);
          baselineLuma = grabLumaFrame();
          prevLuma = null;
          if (err && err.message === "UNSTABLE") {
            setStatus("Screen kept changing. Tap Read now to retry.", "#facc15");
          } else {
            showBannerError(err && err.message ? err.message : String(err));
          }
        })
        .finally(function() {
          // Only release the lock if this run is still the current one
          if (runToken === pipelineRunId) isBusy = false;
        });
    }
  </script>
</body>
